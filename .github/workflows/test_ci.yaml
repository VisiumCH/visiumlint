name: CI

on:
  push:
    branches: [ test/migrate-to-uv ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  chek_python_style:
    name: Check Python style
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v2
        with:
          python-version: '3.10'

    check_packaging:
      name: Check correct packaging 
      runs-on: 'ubuntu-latest'
      steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run visiumlint
        run: |
          uv run visiumlint